<article class="card">
  <div class="card__media">
    @if (recipe().picture) {
      <img class="card__image" [src]="recipe().picture" [alt]="recipe().name" loading="lazy" />
    } @else {
      <div class="card__placeholder"></div>
    }
  </div>

  <div class="card__body">
    <div class="card__meta">
      <span class="card__tag">{{ recipe().category }}</span>
      <span class="card__area">{{ recipe().area }}</span>
    </div>
    <h3 class="card__title">{{ recipe().name }}</h3>
  </div>

  <button
    type="button"
    class="card__favorite"
    [class.card__favorite--active]="isFavorite()"
    [attr.aria-pressed]="isFavorite()"
    [attr.aria-label]="favoriteLabel()"
    (click)="favoriteToggled.emit(recipe().id)"
  >
    <img class="card__heart" [src]="heartIcon()" alt="" width="22" height="22" />
  </button>
</article>
