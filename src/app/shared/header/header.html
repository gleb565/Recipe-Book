<div class="header__inner">
  <a class="header__logo" routerLink="/">
    <img class="header__icon" src="icons/logo.svg" alt="" width="32" height="32" />
    Recipe Book
  </a>

  <nav class="header__nav" aria-label="Main">
    <a
      class="header__link"
      routerLink="/"
      routerLinkActive="header__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Recipes
    </a>
    <a class="header__link" routerLink="/favorites" routerLinkActive="header__link--active">
      Favorites
      @if (favoriteServices.count() > 0) {
        <span class="header__badge">{{ favoriteServices.count() }}</span>
      }
    </a>
  </nav>
</div>
